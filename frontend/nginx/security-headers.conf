# Cabeceras de seguridad para la SPA (no se aplican a /api: NestJS define las suyas con Helmet).
# - script-src 'self': el build desactiva CSS crítico en línea, así no hay handlers inline.
# - style-src 'unsafe-inline': los Web Components de Ionic (Stencil) inyectan estilos en tiempo de ejecución.
# - images.openfoodfacts.org: única fuente de imágenes permitida (también la valida el normalizador Python).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.openfoodfacts.org; font-src 'self' data:; connect-src 'self' https://images.openfoodfacts.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
