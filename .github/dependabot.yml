# Actualizaciones automáticas de dependencias (PRs semanales agrupados).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Runtime y tooling de Angular deben subir juntos: sus peerDependencies son exactas
      # (p. ej. @angular/compiler-cli exige la misma versión de @angular/compiler).
      angular-ionic-capacitor:
        patterns: ["@angular/*", "@angular-devkit/*", "@ionic/*", "@capacitor/*", "ionicons"]
      # vitest y sus paquetes @vitest/* exigen la misma versión: siempre juntos, también en mayores.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # Las versiones mayores llegan en PRs separados para revisarlas una por una.
      dev-tooling:
        dependency-type: development
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "@capacitor/*", "vitest", "@vitest/*"]
        update-types: [minor, patch]
    ignore:
      # Angular 22 exige TypeScript >=6.0 <6.1: TypeScript sube junto con Angular, no por separado.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels: [dependencies, frontend]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      dev-tooling:
        dependency-type: development
        exclude-patterns: ["vitest", "@vitest/*"]
        update-types: [minor, patch]
    ignore:
      # El plugin de Swagger de `nest build` es un transformador del compilador: TypeScript 7
      # (compilador nativo) cambia esa API, así que el salto se evalúa aparte.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Los tipos de Node deben coincidir con el runtime de las imágenes (Node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, backend]

  - package-ecosystem: uv
    directory: /python-service
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, python]

  - package-ecosystem: docker
    directories: [/frontend, /backend, /python-service]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/modules/smartcommerce-stack
      - /infra/terraform/environments/dev
      - /infra/terraform/environments/staging
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, infra]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
